name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md frontmatter
        run: |
          f=skills/fastapi-project-generator/SKILL.md
          head -1 "$f" | grep -qx -- '---'
          grep -q '^name: fastapi-project-generator$' "$f"
          grep -q '^description: .\+' "$f"
      - name: Check referenced files exist
        run: |
          for r in $(grep -o 'references/[a-z-]*\.md' skills/fastapi-project-generator/SKILL.md | sort -u); do
            test -f "skills/fastapi-project-generator/$r" || { echo "missing $r"; exit 1; }
          done
      - name: Lint install script
        run: shellcheck install.sh
